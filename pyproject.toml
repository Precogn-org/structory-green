[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "structory-carbon"
version = "0.1.0"
description = "Estimation du CO2e évité par BYOS + Structory face à un SaaS de référence"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
structory-carbon = "structory_carbon.cli:main"

[tool.setuptools]
packages = ["structory_carbon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
