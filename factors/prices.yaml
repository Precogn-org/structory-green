# Structory Green — prix publics (coût vu de l'éditeur)
#
# Mêmes règles que factors.yaml : valeur, unité, source, URL, date d'accès, version, statut.
# Aucun prix inventé : sans source vérifiable, `value: null` et `status: A_SOURCER`.
# Tous les prix sont en EUR HORS TAXES (catalogue OVHcloud France, TVA 20 % non incluse).
#
# Source principale : API publique de catalogue OVHcloud (sans authentification).
#   cloud : https://eu.api.ovh.com/1.0/order/catalog/public/cloud?ovhSubsidiary=FR  (catalogId 9694)
#   vps   : https://eu.api.ovh.com/1.0/order/catalog/public/vps?ovhSubsidiary=FR    (catalogId 9773)
# Le champ `price` du catalogue est exprimé en 1e-8 EUR ; les valeurs ci-dessous sont converties.
# Conversion annuelle : prix horaire × 8760 h ; prix mensuel × 12.

version: "2026.10.0"
updated: "2026-10-08"

prices:

  # ---------------------------------------------------------------- compute SaaS (OVH Public Cloud)
  ovh_b3_8_hour:
