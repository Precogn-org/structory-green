    source_version: CCF trunk @ f584c549 (2026-04-23)

  storage_hdd_energy:
    description: Énergie d'usage du stockage HDD, par To stocké (hors PUE, hors réplication)
    value: 0.65
    unit: Wh/(To·h)
    status: SOURCE
    source: Cloud Carbon Footprint, méthodologie, HDDCOEFFICIENT
    url: https://www.cloudcarbonfootprint.org/docs/methodology/
    accessed: "2026-10-07"
    source_version: CCF trunk @ f584c549 (2026-04-23)

  # ---------------------------------------------------------------- réplication
