  replication_google_drive:
    description: Facteur de réplication réel de Google Drive / Google Workspace (stockage BYOS typique)
    value: null
    unit: copies
    status: A_SOURCER
    source: Google ne publie pas ce facteur. Aucune source vérifiable trouvée au 2026-10-07.
    url: null
    accessed: "2026-10-07"
    source_version: null
    note: >
      Le calcul utilise alors l'hypothèse `byos.replication` du profil (déclarée comme HYPOTHESE
      dans le rapport). Proxy proposé dans l'exemple : replication_gcp_cloud_storage (2), qui est
      un facteur CCF pour Cloud Storage, pas pour Drive.

  # ---------------------------------------------------------------- compute (énergie)
  cpu_min_watts_aws:
