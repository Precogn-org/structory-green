    value: 0.25654
    unit: kgCO2e/kWh
    status: SOURCE
    source: Our World in Data, « Carbon intensity of electricity generation » (Ember 2026), année 2025 = 256.54 gCO2e/kWh
    url: https://ourworldindata.org/grapher/carbon-intensity-electricity
    accessed: "2026-10-07"
    source_version: OWID grapher, export CSV du 2026-10-07, année 2025

  # ---------------------------------------------------------------- PUE
  pue_industry_avg:
    description: PUE moyen déclaré des centres de données (toutes tailles), enquête mondiale
    value: 1.56
    unit: sans unité
    status: SOURCE
    source: Uptime Institute, Global Data Center Survey 2024 (14e édition) — « industry average PUE remains at 1.56 »
    url: https://www.datacenterknowledge.com/energy-power-supply/data-center-industry-survey-highlights-cost-ai-and-sustainability-challenges
    accessed: "2026-10-07"
    source_version: Uptime Institute Global Data Center Survey 2024

  pue_aws:
    description: PUE moyen retenu pour AWS
    value: 1.135
    unit: sans unité
    status: SOURCE
    source: Cloud Carbon Footprint (Thoughtworks), AWS_CLOUD_CONSTANTS.PUE_AVG
    url: https://github.com/cloud-carbon-footprint/cloud-carbon-footprint/blob/f584c549ee358d5980d36513267d007ecd3ee716/packages/aws/src/domain/AwsFootprintEstimationConstants.ts
    accessed: "2026-10-07"
    source_version: CCF trunk @ f584c549 (2026-04-23)

  pue_google:
