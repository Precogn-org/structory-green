# Structory Green — facteurs d'impact (module carbone)
#
# Règles (voir METHODOLOGIE.md, section 5) :
# - chaque facteur porte : valeur, unité, source, URL, date d'accès, version de la source ;
# - aucun facteur n'est inventé : sans source vérifiable, `value: null` et `status: A_SOURCER` ;
# - `min` / `max`, quand ils existent, viennent de la source elle-même (pas d'une estimation maison) ;
# - un facteur `status: DERIVE` est calculé à partir de facteurs sourcés, la formule est donnée.
#
# Toute modification d'une valeur = nouvelle version de ce fichier (champ `version` ci-dessous).

version: "2026.10.1"
updated: "2026-10-08"

factors:

  # ---------------------------------------------------------------- électricité
  grid_intensity_fr:
    description: Intensité carbone de l'électricité, France, mix moyen consommation (ACV, amont inclus)
    value: 0.0461
    unit: kgCO2e/kWh
    status: SOURCE
    source: ADEME Base Empreinte — « Electricité/2025 - mix moyen/consommation » (lissage 2022-2025), cité par la documentation Nos Gestes Climat (ADEME)
    url: https://nosgestesclimat.fr/documentation/commun/mix-électrique/empreinte-carbone
    accessed: "2026-10-07"
    source_version: Base Empreinte, millésime électricité 2025
    note: Valeur relevée via la documentation publique Nos Gestes Climat ; à recouper directement dans base-empreinte.ademe.fr (accès compte).

  grid_intensity_eu27:
    description: Intensité carbone de la production d'électricité, Union européenne (27), cycle de vie
    value: 0.20990
    unit: kgCO2e/kWh
    status: SOURCE
    source: Our World in Data, « Carbon intensity of electricity generation » (données Ember 2026 ; Energy Institute 2026), année 2025 = 209.89671 gCO2e/kWh
    url: https://ourworldindata.org/grapher/carbon-intensity-electricity
    accessed: "2026-10-07"
    source_version: OWID grapher, export CSV du 2026-10-07, année 2025

  grid_intensity_world:
    description: Intensité carbone de la production d'électricité, moyenne mondiale, cycle de vie
    value: 0.45829
    unit: kgCO2e/kWh
    status: SOURCE
    source: Our World in Data, « Carbon intensity of electricity generation » (Ember 2026), année 2025 = 458.29 gCO2e/kWh
    url: https://ourworldindata.org/grapher/carbon-intensity-electricity
    accessed: "2026-10-07"
    source_version: OWID grapher, export CSV du 2026-10-07, année 2025

  grid_intensity_us:
    description: Intensité carbone de la production d'électricité, États-Unis, cycle de vie
    value: 0.3844
    unit: kgCO2e/kWh
    status: SOURCE
    source: Our World in Data, « Carbon intensity of electricity generation » (Ember 2026), année 2025 = 384.4 gCO2e/kWh
    url: https://ourworldindata.org/grapher/carbon-intensity-electricity
    accessed: "2026-10-07"
    source_version: OWID grapher, export CSV du 2026-10-07, année 2025

  grid_intensity_ie:
