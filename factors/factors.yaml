    unit: sans unité
    status: SOURCE
    source: Google Data Centers — Efficiency, « In 2025, the average annual power usage effectiveness for our global fleet of data centers was 1.09 »
    url: https://datacenters.google/efficiency/
    accessed: "2026-10-07"
