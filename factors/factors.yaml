    url: https://www.ovhcloud.com/sites/default/files/external_files/kpis_fy25.pdf
    accessed: "2026-10-08"
    source_version: KPIs FY25

  # ---------------------------------------------------------------- stockage (énergie)
  storage_ssd_energy:
