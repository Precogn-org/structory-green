    url: null
    accessed: "2026-10-07"
    source_version: null
    note: Non utilisé en V0.1 — trafic utilisateur supposé équivalent dans les deux architectures (voir METHODOLOGIE.md, poste réseau).

  # ---------------------------------------------------------------- fabrication (embodied)
  embodied_vcpu_year_aws_t3_medium:
    description: Impact de fabrication alloué à un vCPU pendant un an (instance AWS t3.medium, 2 vCPU, divisé par 2)
    value: 1.35
    min: 0.797
    max: 2.11
    unit: kgCO2e/(vCPU·an)
    status: SOURCE
    source: >
      API Boavizta v2.4.1, GET /v1/cloud/instance?provider=aws&instance_type=t3.medium&duration=8760&criteria=gwp
      → embedded gwp 2.7 kgCO2e (min 1.594, max 4.22) pour 2 vCPU sur 8760 h ; fin de vie non incluse.
    url: https://api.boavizta.org/v1/cloud/instance?provider=aws&instance_type=t3.medium&verbose=false&duration=8760&criteria=gwp
    accessed: "2026-10-07"
    source_version: Boavizta API 2.4.1

  embodied_hdd_unit:
    description: Impact de fabrication d'un disque dur (HDD), par unité
    value: 31.11
    unit: kgCO2e/disque
    status: SOURCE
    source: Boavizta API, documentation composant HDD, d'après Umweltbundesamt « Green Cloud Computing » (2021)
    url: https://doc.api.boavizta.org/Explanations/components/hdd/
    accessed: "2026-10-07"
    source_version: Boavizta API 2.4.1 ; UBA Texte 94/2021

  embodied_ssd_die:
    description: Impact de fabrication d'un SSD, part proportionnelle à la surface de puce
    value: 2.20
    unit: kgCO2e/cm²
    status: SOURCE
    source: Boavizta API, documentation composant SSD, d'après Umweltbundesamt « Green Cloud Computing » (2021)
    url: https://doc.api.boavizta.org/Explanations/components/ssd/
    accessed: "2026-10-07"
    source_version: Boavizta API 2.4.1 ; UBA Texte 94/2021

  embodied_ssd_base:
    description: Impact de fabrication d'un SSD, part fixe par unité
    value: 6.34
    unit: kgCO2e/SSD
    status: SOURCE
    source: Boavizta API, documentation composant SSD, d'après Umweltbundesamt « Green Cloud Computing » (2021)
    url: https://doc.api.boavizta.org/Explanations/components/ssd/
    accessed: "2026-10-07"
    source_version: Boavizta API 2.4.1 ; UBA Texte 94/2021

  ssd_density:
    description: Densité de stockage d'un SSD (valeur d'exemple du jeu de données Boavizta)
    value: 48.5
    unit: Go/cm²
    status: SOURCE
    source: Boavizta API, documentation composant SSD (valeur par défaut)
    url: https://doc.api.boavizta.org/Explanations/components/ssd/
    accessed: "2026-10-07"
    source_version: Boavizta API 2.4.1

  embodied_ssd_per_tb:
    description: Impact de fabrication d'un SSD de 1 To (1000 Go)
    value: 51.70
    unit: kgCO2e/To
    status: DERIVE
    formula: (1000 / ssd_density) * embodied_ssd_die + embodied_ssd_base = (1000 / 48.5) * 2.20 + 6.34
    source: Calculé à partir des facteurs Boavizta ci-dessus (équation de la documentation SSD Boavizta, capacité 1000 Go)
    url: https://doc.api.boavizta.org/Explanations/components/ssd/
    accessed: "2026-10-07"
    source_version: Boavizta API 2.4.1

  hdd_capacity_datacenter:
    description: Capacité moyenne d'un disque dur en centre de données (pour ramener embodied_hdd_unit au To)
    value: null
    unit: To/disque
    status: A_SOURCER
    source: Aucune source vérifiable d'une capacité moyenne de parc trouvée au 2026-10-07.
    url: null
    accessed: "2026-10-07"
    source_version: null
    note: "Tant qu'il est nul, le calcul V0.1 ne traite l'embodied stockage que pour les supports SSD ; un profil `media: hdd` lève une erreur explicite."
